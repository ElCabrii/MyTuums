# The repo's gitleaks opt-in (pi-lens scans for this file at the project root)
# AND its deliberate exceptions to the default rule set.
#
# The default rules are kept in full — this config only narrows WHAT is
# scanned, never which secret patterns count.
[extend]
useDefault = true

[allowlist]
paths = [
  # `.env` is the gitignored local secrets file (`.gitignore: .env*`): it must
  # hold real credentials, and git refuses to track it, so it can never be a
  # "leak" in the sense this scan guards against (secrets committed to
  # source). Scanning it produces only noise. `.env.example` is deliberately
  # NOT excluded — it is tracked and must stay clean.
  '''(^|[/\\])\.env$''',
  # `dist/` is gitignored build output (`.gitignore: dist/`) — bundled
  # dependency code (better-auth's ASN.1 constants, source maps), never the
  # repo's own secrets, and uncommittable like `.env`.
  '''(^|[/\\])dist[/\\]''',
]
regexes = [
  # Test fixtures use the literal fake value `test-secret-with-at-least-32-chars-1234`
  # (packages/api/src/appeal-token.test.ts) — a length-constrained HMAC key
  # that is deliberately not a secret. No real credential starts with this.
  '''^test-secret''',
]
