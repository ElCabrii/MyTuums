packages:
  - apps/*
  - packages/*
  # End-to-end suite. Its own workspace package so it can depend on
  # @my-tuums/db and @my-tuums/auth for fixture seeding without pulling
  # Playwright into the root manifest.
  - e2e

onlyBuiltDependencies:
  - "@swc/core"
  - esbuild

catalog:
  zod: ^4.4.3
  typescript: ^5.8.3
  "@types/node": ^22.20.1
  # The better-auth family, pinned exact as one unit: the plugins and the core
  # must never resolve to different majors, and packages/api verifies its
  # behavior against these internals. Bump all four together.
  better-auth: 1.6.25
  "@better-auth/i18n": 1.6.25
  "@better-auth/passkey": 1.6.25
  "@better-auth/utils": 0.4.2

patchedDependencies:
  "@better-auth/passkey": patches/@better-auth__passkey.patch
