# The standing replacement for a post-deploy check. CI never deploys — Railway
# builds its own image from the Dockerfile — so a broken Railway config, a bad
# service variable, or a deploy that half-failed was previously invisible
# until a real user hit it. This workflow probes the production service with
# the same three checks the CI docker job's boot step runs against the image:
# the DB-backed health endpoint, a signed-out page (static SPA shell), and the
# page gate's redirect.
#
# The probe targets the Railway origin directly, not the public domain:
# Cloudflare's Bot Fight Mode challenges requests from datacenter IPs, so
# every scheduled run from a GitHub-hosted runner was 403'd at the edge, and
# the free plan cannot skip Bot Fight Mode for specific IPs. The origin is
# what this check protects — Railway config, service variables, deploys — and
# the edge adds nothing to that purpose.
#
# Run it manually right after a deploy (workflow_dispatch); the schedule is
# the standing safety net for deploys nobody remembered to check.
on:
  schedule:
    # Every 6 hours at :17 — an arbitrary minute keeps it clear of
    # top-of-the-hour traffic from other scheduled jobs.
    - cron: "17 */6 * * *"
  workflow_dispatch:

# No checkout, no secrets, no repo writes — the job only curls the origin.
# contents: read is the least this workflow needs.
permissions:
  contents: read

jobs:
  smoke:
    name: Smoke-check production
    runs-on: self-hosted
    steps:
      # The Railway origin: the CNAME target of mytuums.com (production
      # environment's mytuums-server service, port 3001, syncStatus ACTIVE).
      # The Host header is what Cloudflare forwards, so the origin sees the
      # same request it sees in production. If the CNAME ever changes, keep
      # this in step with it.
      - name: Health endpoint (DB + server)
        run: |
          body=$(curl -fsS --max-time 30 -H "Host: mytuums.com" https://bkzt6fl1.up.railway.app/health) || {
            echo "::error::https://bkzt6fl1.up.railway.app/health failed - is the server up?";
            exit 1; }
          echo "$body" | grep -q '"status":"ok"' || {
            echo "::error::unexpected health body: $body";
            exit 1; }
          echo "Health ok."

      - name: Login page serves the SPA shell
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -H "Host: mytuums.com" https://bkzt6fl1.up.railway.app/login)
          [ "$code" = "200" ] || {
            echo "::error::/login returned $code instead of 200";
            exit 1; }
          type=$(curl -s -o /dev/null -w '%{content_type}' --max-time 30 -H "Host: mytuums.com" https://bkzt6fl1.up.railway.app/login)
          echo "$type" | grep -q 'text/html' || {
            echo "::error::/login served content-type $type instead of text/html";
            exit 1; }
          echo "SPA shell served."

      - name: Page gate redirects signed-out visitors
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -H "Host: mytuums.com" https://bkzt6fl1.up.railway.app/)
          [ "$code" = "302" ] || {
            echo "::error::/ returned $code instead of 302 - the page gate is not live";
            exit 1; }
          target=$(curl -s -o /dev/null -w '%{redirect_url}' --max-time 30 -H "Host: mytuums.com" https://bkzt6fl1.up.railway.app/)
          echo "$target" | grep -q '/login?redirect=' || {
            echo "::error::/ redirected to $target instead of /login?redirect=...";
            exit 1; }
          echo "Page gate redirects."
