name: CI

on:
  push:
    branches: [main, codex/cloudflare-poc, codex/cloudflare-production]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

# Native artifact and Workflows checks belong to pnpm verify. Both jobs use
# isolated local D1/R2 and synthetic providers; CI never deploys or needs secrets.
jobs:
  verify:
    name: Verify
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - run: pnpm verify
        env:
          TMPDIR: ${{ runner.temp }}

  e2e:
    name: E2E tests
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(pnpm --filter @my-tuums/e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # Browser system libraries are installed on the self-hosted runner.
      - name: Install Chromium
        run: pnpm --filter @my-tuums/e2e exec playwright install chromium
      - run: pnpm test:e2e
        env:
          TMPDIR: ${{ runner.temp }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
