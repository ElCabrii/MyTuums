name: CI

on:
  push:
    branches:
      - main
      - release/**
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  # A push may already be applying migrations or deploying one part of the
  # Worker stack. Let it finish before a newer commit starts its release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  checks: read
  contents: read

# Verification uses isolated local resources and synthetic providers. Push
# deployments receive Cloudflare credentials only after every check succeeds.
jobs:
  verify:
    name: Verify
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - run: pnpm verify
        env:
          TMPDIR: ${{ runner.temp }}

  e2e:
    name: E2E tests
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(pnpm --filter @my-tuums/e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # Browser system libraries are installed on the self-hosted runner.
      - name: Install Chromium
        run: pnpm --filter @my-tuums/e2e exec playwright install chromium
      - run: pnpm test:e2e
        env:
          TMPDIR: ${{ runner.temp }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - run: pnpm --filter @my-tuums/link-fetcher exec tsup
      - run: docker build --tag mytuums-link-fetcher-ci apps/link-fetcher
      # Exercise the deployed non-root user's ability to read the generated bundle.
      - run: docker run --rm --network none --entrypoint node mytuums-link-fetcher-ci --check /app/server.cjs

  deploy-production:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, e2e, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: cloudflare-production-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - name: Deploy the verified Cloudflare stack
        run: pnpm --filter @my-tuums/db deploy:preview --target=production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_SOCIAL_PROVIDERS: google,discord,twitch

  deploy-preview:
    name: Deploy preview
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
    needs: [verify, e2e, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: cloudflare-preview-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - name: Deploy the verified Cloudflare stack
        run: pnpm --filter @my-tuums/db deploy:preview --target=preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_SOCIAL_PROVIDERS: google,discord,twitch
