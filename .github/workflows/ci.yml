name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per ref at a time: a newer push to the same branch/PR cancels
# the in-flight run instead of queuing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The default GITHUB_TOKEN would otherwise inherit the repo's default
# permissions. Everything CI does — checkout, install, test, build, the
# playwright-report artifact, the GHA cache — is satisfied by read-only
# contents; nothing here pushes or writes issues/releases.
permissions:
  contents: read

env:
  # Kept in one place so the three jobs cannot drift apart. The password is a
  # throwaway for the ephemeral service container.
  POSTGRES_PASSWORD: ci-postgres-password
  DATABASE_URL: postgresql://postgres:ci-postgres-password@localhost:5432/mytuums
  DATABASE_URL_TEST: postgresql://postgres:ci-postgres-password@localhost:5432/mytuums_test
  BETTER_AUTH_SECRET: ci-better-auth-secret-at-least-32-characters
  BETTER_AUTH_URL: http://localhost:3001
  WEB_ORIGIN: http://localhost:5173

jobs:
  # Third-party actions are pinned to the full commit SHA their major tag
  # points at (supply-chain hygiene: mutable tags can be silently repointed —
  # see the trivy-action and kics-github-action compromises). The trailing
  # `# vN` comment records the tag for the next bump: re-resolve the tag,
  # update the SHA, keep the comment in step. Every checkout also sets
  # `persist-credentials: false` — CI never pushes, and the default leaves
  # the GITHUB_TOKEN in .git/config, where an uploaded artifact could leak it.
  # Build first, and not only because it must pass: `src/routeTree.gen.ts` and
  # `src/paraglide/**` are generated by Vite plugins and git-ignored, so
  # `typecheck` cannot resolve a route `to=` target or a message function until
  # a build has run once.
  check:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      # Turbo's local cache lives at `.turbo/cache` (the 2.x default, already
      # gitignored), so caching the parent directory persists it between runs.
      # Turbo hashes task inputs itself, so a restored cache can never replay
      # a stale result — a hit is only used when the inputs match byte for
      # byte. The per-commit key writes a fresh save each run; the prefix
      # restores the previous run's cache when the exact key misses, which is
      # most of the time (deps and sources change every commit).
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # --frozen-lockfile: the committed lockfile is authoritative — any
      # drift between it and a package.json fails here rather than
      # installing something different from what CI will run.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      # The repo is formatted by Prettier (root .prettierrc); a stray
      # unformatted file fails the check rather than silently drifting.
      - run: pnpm exec prettier --check .

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # No database service on this job on purpose. The unit projects must pass
      # with nothing to connect to — that is what keeps the unit/integration
      # split honest rather than incidental.
      - run: pnpm test:unit

  integration:
    name: Integration tests
    runs-on: ubuntu-latest

    services:
      # Ephemeral Postgres — same image (postgres:16-alpine) as
      # docker-compose.yml, so CI exercises the same major version as dev.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: mytuums
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mytuums"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The db:* and e2e scripts all run through `dotenv -e .env`, which errors
      # on a missing file. Writing the workflow env out is simpler than
      # special-casing the scripts, and dotenv does not override variables that
      # are already set, so the two stay consistent either way.
      - name: Write .env
        run: |
          cat > .env <<EOF
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          DATABASE_URL=${DATABASE_URL}
          DATABASE_URL_TEST=${DATABASE_URL_TEST}
          BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
          BETTER_AUTH_URL=${BETTER_AUTH_URL}
          WEB_ORIGIN=${WEB_ORIGIN}
          EOF

      # Catches a schema edit that never had `db:generate` run against it.
      # The integration tests would fail anyway — `db:test:setup` builds the
      # test database from the migrations — but as a confusing "column does
      # not exist" three files away rather than as the drift it is.
      - run: pnpm --filter @my-tuums/db db:check

      - run: pnpm db:test:setup
      - run: pnpm test:integration

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    # The default job timeout is 6 hours — far past what this suite can take.
    # A hung spec would otherwise burn runner time before failing on its own.
    timeout-minutes: 60

    services:
      # Same ephemeral Postgres as the integration job.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: mytuums
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mytuums"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Write .env
        run: |
          cat > .env <<EOF
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          DATABASE_URL=${DATABASE_URL}
          DATABASE_URL_TEST=${DATABASE_URL_TEST}
          BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
          BETTER_AUTH_URL=${BETTER_AUTH_URL}
          WEB_ORIGIN=${WEB_ORIGIN}
          S3_ENDPOINT=${S3_ENDPOINT}
          S3_BUCKET=${S3_BUCKET}
          S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
          S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
          S3_REGION=${S3_REGION}
          EOF
        env:
          # A bucket of its own — NOT the dev one. `truncateAll()` in
          # e2e/support/db.ts deletes objects by prefix, so sharing a bucket
          # with a developer's local `pnpm test:e2e` would let the two runs
          # delete each other's objects mid-test.
          #
          # Absent on a fork PR, where secrets are not exposed. The upload specs
          # then skip themselves (settings.spec.ts's `storageBucketConfigured()`
          # — the same all-or-nothing group check `s3Env()` applies) and the
          # rest of the suite runs unchanged, rather than the job failing on
          # something a fork cannot supply.
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_REGION: ${{ secrets.S3_REGION }}

      - run: pnpm db:test:setup

      # Keyed on the resolved Playwright version rather than the lockfile hash:
      # the browser build only changes when Playwright itself does, so this
      # stays warm across ordinary dependency bumps.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(pnpm --filter @my-tuums/e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        run: pnpm --filter @my-tuums/e2e exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      # Uploaded even when the job failed — that is when the report matters.
      # Kept 7 days for flake triage, then auto-expired.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  # The Dockerfile is load-bearing and nothing above touches it: `pnpm build`
  # builds the apps, but the image is where the web bundle, the migration SQL
  # and the VITE_* build args actually come together. Two production breakages
  # got past a fully green CI before this job existed — a missing `ARG` that
  # shipped a bundle with no OAuth buttons, and a static-file rule that 404'd
  # the whole site — because neither is reachable without building the image.
  #
  # Beyond the static assertions below, the image is now BOOTED with its real
  # CMD (`node apps/server/dist/index.js` — the exact process Railway starts)
  # against a real Postgres, and probed over HTTP. The E2E suite runs the dev
  # server; only this job ever starts the production artifact, so a broken
  # one-origin setup or a boot-time env failure would otherwise first be seen
  # by a real user.
  #
  # Build only, no push: Railway builds its own image on deploy. This exists to
  # fail the commit, not to produce an artifact.
  docker:
    name: Docker image builds
    runs-on: ubuntu-latest

    services:
      # Same ephemeral Postgres as the integration and e2e jobs. The image's
      # ports are published to the runner's localhost, which the container
      # reaches through `--network host` (the runner is a native Linux VM, so
      # host networking shares the runner's namespace).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: mytuums
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mytuums"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build the server image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: false
          # Dummy values: this proves the ARGs are declared and the build
          # consumes them, without putting real client ids in CI. The bundle
          # assertion below is what checks they actually land.
          build-args: |
            VITE_SOCIAL_PROVIDERS=google,discord,twitch
            VITE_GOOGLE_CLIENT_ID=ci-placeholder.apps.googleusercontent.com
          load: true
          tags: mytuums-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The regression that motivated this job. Vite inlines VITE_* at build
      # time, so a missing `ARG` in the Dockerfile yields an image that starts
      # cleanly and silently renders no OAuth buttons. Grepping the built
      # bundle is the only place that is observable.
      - name: Assert build args reached the web bundle
        run: |
          docker create --name ci-check mytuums-server:ci
          docker cp ci-check:/app/apps/web/dist ./image-web-dist
          docker rm ci-check
          grep -rq "google,discord,twitch" ./image-web-dist/assets             || { echo "::error::VITE_SOCIAL_PROVIDERS did not reach the bundle - is the ARG declared in the builder stage?"; exit 1; }
          grep -rq "ci-placeholder.apps.googleusercontent.com" ./image-web-dist/assets             || { echo "::error::VITE_GOOGLE_CLIENT_ID did not reach the bundle - is the ARG declared in the builder stage?"; exit 1; }
          echo "Both VITE_* build args are baked into the bundle."

      # The footer's "v0.4.2" is baked in from package.json by
      # vite.config.ts's `define`; a broken define would leave the raw
      # `__APP_VERSION__` identifier in the bundle and crash the footer at
      # runtime — visible nowhere but here (same failure mode as the VITE_*
      # ARGs above). `.js` only on purpose: assets/ also holds sourcemaps,
      # whose sourcesContent contains the original sources.
      #
      # First grep: the raw identifier must be GONE — found means a broken
      # define (grep -q exits 0 on a match, so `&&` fails the step).
      # Second grep: the version must be present, anchored on the stage
      # literals from app-version.ts because the minifier hoists the version
      # into a module constant and renders the footer as a template
      # (`v${na}`), so there is no single "v0.4.2" literal to match. The
      # "alpha":"beta" marker is unique to our module, which rules out the
      # version literals that vendored chunks ship, and the x.y.z pattern is
      # bump-robust — no hardcoded version to edit on release, and an
      # empty/garbage define fails because there is no digits.digits.digits
      # literal left next to the marker.
      - name: Assert the app version reached the web bundle
        run: |
          grep -rq --include="*.js" "__APP_VERSION__" ./image-web-dist/assets             && { echo "::error::__APP_VERSION__ was not replaced - is define set in apps/web/vite.config.ts?"; exit 1; }
          grep -rqE --include="*.js" '"alpha":"beta"[^"]{0,80}"[0-9]+\.[0-9]+\.[0-9]+"' ./image-web-dist/assets             || { echo "::error::the version string did not reach the bundle"; exit 1; }
          echo "App version is baked into the bundle."

      # The migration runner ships in the image and runs as Railway's
      # pre-deploy step. If its entry point or the SQL folder ever stops being
      # copied, the deploy is where you would find out.
      - name: Assert the migration runner and SQL shipped
        run: |
          docker run --rm --entrypoint sh mytuums-server:ci -c             'test -f apps/server/dist/migrate.js && test -f packages/db/drizzle/meta/_journal.json'             || { echo "::error::migrate.js or packages/db/drizzle missing from the image"; exit 1; }
          echo "Migration runner and SQL are present in the image."

      # The regression that motivated this step (issue #58): the runner used
      # to `pnpm install --prod` over the both-workspaces prune, shipping the
      # entire web dependency tree (react, jotai, shadcn, ...) into an image
      # whose process never imports any of it — Vite already bundled the SPA.
      # The first test fails on that old layout (apps/web/node_modules held
      # the tree); the second proves the server's own prod deps ARE installed,
      # so the guarantee cannot be "satisfied" by pruning the runner down to
      # nothing.
      - name: Assert the runner installs only the server's production dependencies
        run: |
          docker run --rm --entrypoint sh mytuums-server:ci -c             'test ! -d apps/web/node_modules'             || { echo "::error::apps/web dependencies were installed into the runner - prune the runner to @my-tuums/server alone"; exit 1; }
          docker run --rm --entrypoint sh mytuums-server:ci -c             'test -d apps/server/node_modules/better-auth'             || { echo "::error::the server's production dependencies are missing from the runner"; exit 1; }
          echo "Runner holds the server's prod deps and nothing from apps/web."

      # Everything above inspects the image; this step RUNS it. The pre-deploy
      # migration is the exact one-shot Railway runs before starting the app,
      # and the boot below uses the image's real CMD with no overrides — the
      # same process a deployed container runs.
      #
      # `--network host` is required here, not optional: the Postgres service
      # port is published on the RUNNER's loopback, and a plain `docker run`
      # puts the container on the default bridge where `localhost` is the
      # container's own loopback — the migrate process could not reach the
      # database at all.
      - name: Run the pre-deploy migration
        run: |
          docker run --rm --network host -e "DATABASE_URL=${DATABASE_URL}" \
            mytuums-server:ci node apps/server/dist/migrate.js

      # The production smoke: boot the image (real CMD), then probe the same
      # three surfaces a deployed app must serve — the DB-backed health
      # endpoint, a signed-out page (static SPA shell through the real file
      # handler), and the page gate's redirect. A failure anywhere here means
      # the artifact is broken even though every assertion above passed.
      #
      # Every curl carries `--max-time`: a Postgres that accepts TCP but never
      # answers a query has no other bound (postgres.js has no default query
      # timeout), so without it a half-open health probe would pin the loop
      # until the job's default 6-hour timeout.
      - name: Boot the image and probe it over HTTP
        run: |
          docker run -d --name ci-smoke-server --network host \
            -e "DATABASE_URL=${DATABASE_URL}" \
            -e "BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}" \
            -e "BETTER_AUTH_URL=${BETTER_AUTH_URL}" \
            -e "WEB_ORIGIN=${WEB_ORIGIN}" \
            -e PORT=3001 -e HOST=0.0.0.0 -e NODE_ENV=production \
            mytuums-server:ci || {
            echo "::error::docker run failed - the image could not be started";
            exit 1; }

          for _ in $(seq 1 30); do
            curl -f --max-time 10 http://localhost:3001/health > /tmp/health.json 2>/dev/null && break
            sleep 2
          done

          curl -fsS --max-time 10 http://localhost:3001/health > /tmp/health.json || {
            echo "::error::the image's CMD did not become healthy after 30 attempts - the production process does not boot";
            docker logs ci-smoke-server;
            exit 1; }
          grep -q '"status":"ok"' /tmp/health.json || {
            echo "::error::health endpoint did not report ok: $(cat /tmp/health.json)";
            docker logs ci-smoke-server;
            exit 1; }

          login_code=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' http://localhost:3001/login)
          [ "$login_code" = "200" ] || {
            echo "::error::/login returned $login_code instead of 200 - the static SPA is not being served";
            docker logs ci-smoke-server;
            exit 1; }
          login_type=$(curl -s --max-time 10 -o /dev/null -w '%{content_type}' http://localhost:3001/login)
          echo "$login_type" | grep -q 'text/html' || {
            echo "::error::/login served content-type $login_type instead of text/html";
            docker logs ci-smoke-server;
            exit 1; }

          root_code=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' http://localhost:3001/)
          [ "$root_code" = "302" ] || {
            echo "::error::/ returned $root_code instead of 302 - the page gate is not live";
            docker logs ci-smoke-server;
            exit 1; }
          root_target=$(curl -s --max-time 10 -o /dev/null -w '%{redirect_url}' http://localhost:3001/)
          echo "$root_target" | grep -q '/login?redirect=' || {
            echo "::error::/ redirected to $root_target instead of /login?redirect=...";
            docker logs ci-smoke-server;
            exit 1; }

          docker rm -f ci-smoke-server >/dev/null || true
          echo "Image boots with its real CMD: health ok, SPA served, page gate redirects."
