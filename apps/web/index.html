<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/mytuums.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171719" media="(prefers-color-scheme: dark)" />
    <!-- `mobile-web-app-capable` is the surviving spelling: Chromium deprecation-warns
         on the `apple-` one, and standalone mode is driven by the manifest's
         `display: standalone` everywhere that still matters. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Static unfurl metadata, wrapped in markers the SERVER replaces per
         route (apps/server/src/public-heads.ts) before the file ships: this
         file is the only head a no-JS crawler ever sees, and since /post/*
         became public (0.4.0) those crawlers get route-specific tags here.
         Once React mounts, __root.tsx removes every [data-app-fallback] tag
         and each route's head() re-emits the same set with localized,
         per-page values (src/lib/document-head.ts owns those shapes — keep
         origin and copy in step with it). English-only is deliberate;
         Paraglide lives in the bundle and cannot reach this markup, like the
         splash below. -->
    <!-- app-head-fallback-start -->
    <title data-app-fallback>MyTuums — The social media, for gamers</title>
    <meta data-app-fallback name="description" content="The social media, for gamers." />
    <!-- No canonical in the GENERIC fallback: it is route-agnostic, and a
         static one would claim every crawlable URL is a duplicate of the
         homepage. The server's per-route substitution (and, after mount,
         each route's head()) emits its own canonical instead. -->
    <meta data-app-fallback property="og:title" content="MyTuums — The social media, for gamers" />
    <meta data-app-fallback property="og:description" content="The social media, for gamers." />
    <meta data-app-fallback property="og:type" content="website" />
    <meta data-app-fallback property="og:url" content="https://mytuums.com/" />
    <meta data-app-fallback property="og:site_name" content="MyTuums" />
    <meta data-app-fallback property="og:image" content="https://mytuums.com/mytuums-512.png" />
    <meta data-app-fallback name="twitter:card" content="summary" />
    <meta data-app-fallback name="twitter:title" content="MyTuums — The social media, for gamers" />
    <meta data-app-fallback name="twitter:description" content="The social media, for gamers." />
    <meta data-app-fallback name="twitter:image" content="https://mytuums.com/mytuums-512.png" />
    <!-- app-head-fallback-end -->
    <!-- Organization entity stacking (schema.org): tells search engines that
         this site and the profiles below are one brand entity. Only genuine,
         crawlable profiles belong in `sameAs`. Sits outside [data-app-fallback]
         because it is crawler-owned and never duplicated by the SPA. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "MyTuums",
        "description": "The social media, for gamers.",
        "url": "https://mytuums.com",
        "logo": "https://mytuums.com/mytuums-512.png",
        "sameAs": [
          "https://x.com/mytuums",
          "https://www.instagram.com/mytuums/",
          "https://www.tiktok.com/@mytuums",
          "https://www.youtube.com/@MyTuums",
          "https://github.com/MyTuums"
        ]
      }
    </script>
    <style>
      /* The cold-load splash, static on purpose. It lives here rather than in
         React so it paints on the very first frame — before the bundle has
         even parsed, let alone fetched the session. React never renders it:
         `sessionSettledEffect` (src/atoms/session.ts) removes this element the
         moment the first `/get-session` lands, and `__root.tsx` renders
         nothing behind it until then.

         The colours are hardcoded from the tokens in src/index.css (the
         `light` and `.dark` blocks), because the bundle's CSS has not loaded
         yet. `light-dark()` follows the OS scheme rather than the app's stored
         theme preference — the splash must work before any JS can read
         localStorage — and the first declaration is the fallback for browsers
         without `light-dark()`.

         "Loading" is the one string the i18n system cannot reach: Paraglide
         compiles into the bundle, and this markup ships before it. */
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        color-scheme: light dark;
        background: oklch(1 0 0);
        background: light-dark(oklch(1 0 0), oklch(0.141 0.005 285.823));
      }

      #app-splash img {
        height: 3.5rem;
        width: auto;
      }

      #app-splash .mytuums-splash-spinner {
        width: 1.5rem;
        height: 1.5rem;
        border-radius: 9999px;
        border: 3px solid
          light-dark(oklch(0.525 0.223 3.958 / 0.25), oklch(0.459 0.187 3.815 / 0.25));
        border-top-color: light-dark(oklch(0.525 0.223 3.958), oklch(0.459 0.187 3.815));
        animation: mytuums-spin 1s linear infinite;
      }

      @keyframes mytuums-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #app-splash .mytuums-splash-spinner {
          animation: none;
        }
      }

      #app-splash .mytuums-splash-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="app-splash" role="status" aria-busy="true">
      <img src="/mytuums.svg" alt="MyTuums logo" />
      <div class="mytuums-splash-spinner" aria-hidden="true"></div>
      <span class="mytuums-splash-sr">Loading</span>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
