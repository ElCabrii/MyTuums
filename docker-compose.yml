services:
  # Local dev Postgres. The database name `mytuums` must stay in agreement
  # with DATABASE_URL in .env (host-side processes) and the server service's
  # DATABASE_URL below (in-network). Same image as CI's service container.
  postgres:
    image: postgres:16-alpine
    container_name: mytuums-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: mytuums
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mytuums"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot migration runner: applies `packages/db/drizzle` to the postgres
  # service and exits. `docker compose up` runs it between Postgres (healthy)
  # and the server, so a fresh clone's first `pnpm docker:up` boots against a
  # current schema instead of serving 500s on every query. Same image as the
  # server — the Dockerfile already ships `apps/server/dist/migrate.js` and
  # the drizzle SQL; this is the exact pre-deploy step Railway runs.
  #
  # No `restart` on purpose: one-shot, unlike the long-running services. It
  # re-runs on every `up`, which is safe — drizzle's migrator skips
  # already-applied migrations by hash.
  migrate:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: mytuums-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # migrate.js (tsup-bundled) imports @my-tuums/db, which needs nothing
      # but DATABASE_URL. MIGRATIONS_DIR defaults to `packages/db/drizzle` —
      # the path the Dockerfile copies the SQL to, relative to /app (the
      # image's WORKDIR) — so no other variable is required.
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/mytuums
    command: ["node", "apps/server/dist/migrate.js"]

  # The production server image on :3001 — the same Dockerfile Railway
  # deploys, so this stack runs what prod runs.
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: mytuums-server
    restart: always
    # `service_healthy` (the pg_isready probe above), not merely
    # `service_started`: the server must not boot before Postgres accepts
    # connections.
    depends_on:
      postgres:
        condition: service_healthy
      # A healthy Postgres is not a *migrated* one — the server must not
      # start until the schema is current.
      migrate:
        condition: service_completed_successfully
    environment:
      # Points at the `postgres` service by its Compose DNS name, not
      # `localhost` — the two containers are on their own network. Host-side
      # tooling (pnpm dev, drizzle-kit) uses the top-level DATABASE_URL in
      # .env instead, which correctly says `localhost`.
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/mytuums
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set in .env (>=32 random chars)}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3001}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      PORT: 3001
      # env.HOST defaults to 127.0.0.1 (see apps/server/src/env.ts) so a
      # bare-metal process doesn't expose the auth API to the LAN. Inside
      # this container that default would make the server unreachable
      # through the published port below, since Docker's port mapping talks
      # to the container's network interface, not its loopback — so it's
      # deliberately overridden to 0.0.0.0 here.
      HOST: 0.0.0.0
      NODE_ENV: production
      # Optional, and passed through rather than defaulted so the container
      # behaves exactly like a host-side `pnpm dev` reading the same .env.
      # `:-` yields an empty string when unset, which packages/auth/src/env.ts
      # treats as absent — so an unconfigured provider is simply not
      # registered rather than half-registered. Without these the container
      # silently has NO social providers, and an OAuth callback that reaches
      # it fails with `state_mismatch` (see the port note in
      # docs/operations.md).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      # Object storage for avatars and banners. Passed through rather than
      # defaulted, same as the OAuth pairs above: `:-` yields an empty string
      # when unset, which the server treats as absent — so the container runs
      # with uploads simply unavailable rather than half-configured. Note
      # apps/server/src/env.ts refuses to boot on a PARTIAL group.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_REGION: ${S3_REGION:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      PASSKEY_RP_ID: ${PASSKEY_RP_ID:-}
    ports:
      - "3001:3001"

# Named volume: data survives `docker compose down`; only `down -v` wipes it.
volumes:
  postgres_data:
